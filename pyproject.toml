[build-system]
requires = ["hatchling >= 1.26", "pgzero", "pillow", "pygame"]
build-backend = "hatchling.build"

[project]
name = "diamond_square"
version = "0.1.1"
authors = [
  { name="Gautam Pulugurta", email="gootyboy@gmail.com" },
]
description = "A package which can implement and draw the diamond-square in pgzero and pygame. Uses C for fast rendering."
readme = "README.md"
requires-python = ">=3.5"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/gootyboy/diamond_square"
Issues = "https://github.com/gootyboy/diamond_square/issues"